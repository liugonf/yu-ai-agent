<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 恋爱大师</title>
<style>
:root{--primary:#7c4dff;--primary-dark:#6d28d9;--text:#1f2937;--bg:#faf8ff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid #efe9ff}
.topbar-inner{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:28px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px}
.logo-heart{font-size:24px}
.nav{display:flex;gap:22px;margin-left:auto}
.nav a{color:#4b5563;font-size:15px;text-decoration:none}
.btn-register{margin-left:auto;padding:8px 20px;border:none;border-radius:999px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-size:14px;cursor:pointer}
.hero{text-align:center;padding:64px 20px 56px;background:linear-gradient(135deg,#f5f3ff,#ede9fe,#e0e7ff)}
.hero h1{font-size:38px;margin:0 0 14px;background:linear-gradient(135deg,#6d28d9,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#6b7280;font-size:17px;margin:0 0 26px}
.btn-primary{padding:12px 28px;border:none;border-radius:999px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 8px 20px rgba(124,77,255,.35)}
.app{max-width:880px;margin:-24px auto 48px;padding:0 20px}
.chat{display:flex;flex-direction:column;height:68vh;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(124,77,255,.12)}
.chat-head{display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff}
.avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:20px}
.name{font-weight:700}.status{font-size:12px;opacity:.9}
.chat-box{flex:1;overflow-y:auto;padding:18px;background:#faf8ff}
.row{display:flex;margin-bottom:12px}
.row.user{justify-content:flex-end}.row.ai{justify-content:flex-start}
.bubble{max-width:72%;padding:12px 16px;border-radius:16px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.row.user .bubble{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;border-bottom-right-radius:4px}
.row.ai .bubble{background:#ede9fe;color:#1f2937;border-bottom-left-radius:4px}
.typing{color:#8b5cf6}
.input-row{display:flex;gap:8px;padding:12px;border-top:1px solid #efe9ff}
.input-row input{flex:1;padding:12px;border:1px solid #e5dffb;border-radius:999px;outline:none}
.send,.stop{padding:0 20px;border:none;border-radius:999px;cursor:pointer;color:#fff;font-weight:600}
.send{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}.stop{background:#c4b5fd}
.footer{text-align:center;padding:22px;color:#9ca3af;font-size:13px}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo"><span class="logo-heart">💜</span><span>AI 恋爱大师</span></div>
    <nav class="nav"><a href="#hero">首页</a><a href="#chat" onclick="scrollToChat()">AI 恋爱大师</a></nav>
    <button class="btn-register">免费注册</button>
  </div>
</header>

<section class="hero" id="hero">
  <h1>遇见爱情，从一次对话开始</h1>
  <p>专业的 AI 恋爱顾问，陪你聊聊单身、恋爱与婚姻中的那些事</p>
  <button class="btn-primary" onclick="scrollToChat()">立即咨询</button>
</section>

<main class="app" id="chat">
  <div class="chat">
    <div class="chat-head">
      <div class="avatar">💜</div>
      <div><div class="name">AI 恋爱顾问</div><div class="status">在线 · 用心倾听每一段感情</div></div>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-row">
      <input id="input" placeholder="和恋爱大师聊聊吧…" />
      <button class="send" id="sendBtn">发送</button>
      <button class="stop" id="stopBtn" style="display:none">停止</button>
    </div>
  </div>
</main>

<footer class="footer">AI 恋爱大师 · 仅供学习演示 · 数据由 AI 生成，请勿作为真实情感建议</footer>

<script>
var chatId = 'love-' + Date.now();
var es = null;
var box = document.getElementById('chatBox');
var input = document.getElementById('input');

function scrollToChat(){ document.getElementById('chat').scrollIntoView({behavior:'smooth'}); }

function addBubble(role, text){
  var row = document.createElement('div');
  row.className = 'row ' + role;
  var b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
  return b;
}

addBubble('ai', '你好呀～我是你的 AI 恋爱顾问。无论是单身、恋爱还是婚姻中的困惑，都可以跟我说说 💜');

function send(){
  var text = input.value.trim();
  if(!text || es) return;
  addBubble('user', text);
  var aiBubble = addBubble('ai', '');
  input.value = '';
  document.getElementById('sendBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = '';
  var url = '/api/ai/love_app/chat/sse?message=' + encodeURIComponent(text) + '&chatId=' + encodeURIComponent(chatId);
  es = new EventSource(url);
  es.onmessage = function(e){ aiBubble.textContent += e.data; box.scrollTop = box.scrollHeight; };
  es.onerror = function(){ closeEs(); aiBubble.textContent = aiBubble.textContent || '连接中断，请稍后再试'; };
}

function closeEs(){
  if(es){ es.close(); es = null; }
  document.getElementById('sendBtn').style.display = '';
  document.getElementById('stopBtn').style.display = 'none';
}

document.getElementById('sendBtn').onclick = send;
document.getElementById('stopBtn').onclick = closeEs;
input.addEventListener('keydown', function(e){ if(e.key === 'Enter') send(); });
</script>
</body>
</html>
