# ===== 示例配置模板 =====
# 用法：复制本文件为 application.yml（该文件已被 .gitignore 忽略，不会提交），
# 然后把下面的占位符替换成你自己的真实配置。
spring:
  application:
    name: yu-ai-agent
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  ai:
    dashscope:
      # 阿里云百炼 API Key
      api-key: "sk-你的百炼APIKey"
      # 专属版（专属部署）服务地址；用公共版可改为 https://dashscope.aliyuncs.com/api/v1
      base-url: "https://dashscope.aliyuncs.com/api/v1"
      chat:
        options:
          model: "qwen-turbo"
    # MCP 客户端：stdio 方式加载本地图片搜索 MCP 服务
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json

server:
  port: 8124
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match:
        - '/**'
      packages-to-scan:
        - 'com.yuoi.yuaiagent.controller'

knife4j:
  enable: true
  setting:
    language: zh_cn

# 老接口（原生 DashScope SDK）配置
dashscope:
  api-key: "sk-你的百炼APIKey"
  model: "qwen-turbo"
  base-url: "https://dashscope.aliyuncs.com/api/v1"
  system-prompt: "You are a helpful assistant."

# 本地知识库向量化使用的 Embedding 配置（走百炼 OpenAI 兼容端点）
embedding:
  api-key: "sk-你的百炼APIKey"
  base-url: "https://dashscope.aliyuncs.com"
  model: "text-embedding-v3"

# 云知识库 RAG（百炼云知识库检索）
love:
  rag:
    api-key: "sk-你的百炼APIKey"
    base-url: "https://dashscope.aliyuncs.com"
    agent-id: "aid-你的知识库ID"

# PGVector（可选）
pgvector:
  enabled: false
  url: "jdbc:postgresql://你的公网地址:5432/你的库名"
  username: "你的用户名"
  password: "你的密码"

# 对话记忆持久化到 MySQL（可选；enabled=false 时用本地文件记忆）
mysql:
  enabled: false
  url: "jdbc:mysql://你的MySQL地址:3306/你的库名?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
  username: "你的用户名"
  password: "你的密码"
